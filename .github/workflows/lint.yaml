name: Lint
on:
  push:
    branches-ignore:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: "./.github/shared/setup-node"
        # Build before test to get the SvelteKit files
      - name: Test build
        run: pnpm build
      - name: Lint
        run: pnpm lint
