name: Test
on:
  push:
    branches-ignore:
      - main
jobs:
  test-svelte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: "./.github/shared/setup-node"
      - name: Test
        run: pnpm test
      - name: Test build
        run: pnpm build
